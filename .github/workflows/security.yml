name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily: a dependency that is clean today can be vulnerable tomorrow
    # without a single commit being made.
    - cron: "0 5 * * *"

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every job below is independent and runs in parallel.

  # --- SAST: static analysis of our own code -------------------------------
  codeql:
    name: codeql (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: python
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4

  # --- SCA: known CVEs in our dependency tree ------------------------------
  dependencies:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Resolve the full runtime + test dependency set
        run: uv pip compile pyproject.toml --all-extras --group test -o requirements.txt
      - name: Audit against the PyPI Advisory Database
        run: uvx pip-audit --strict --desc -r requirements.txt

  # --- SCA, second opinion: OSV's broader vulnerability database -----------
  osv:
    name: osv-scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # NB: the real action lives in a subdirectory - the repo-root action.yml
      # has no `runs:` section and fails with "Top level 'runs:' section is
      # required". `--skip-git` is a v1 flag and no longer exists in v2.
      - uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            ./

  # --- Supply chain: our own workflows -------------------------------------
  workflows:
    name: zizmor (workflow security)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uvx zizmor --format sarif .github/workflows/ > zizmor.sarif
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  # --- Secrets -------------------------------------------------------------
  # Note: the pre-commit job in test.yml also runs gitleaks over the working
  # tree. This job additionally scans full git *history*, which pre-commit
  # cannot see.
  secrets:
    name: gitleaks (git history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0          # full history
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action is free for personal and public repositories.
          # Organisation-owned private repos need a GITLEAKS_LICENSE secret.

  # --- Supply-chain posture -------------------------------------------------
  scorecard:
    name: ossf scorecard
    runs-on: ubuntu-latest
    # Scorecard needs the default branch; skip it on pull requests.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard
