# Install once with:  uvx pre-commit install
# Run over everything: uvx pre-commit run --all-files
#
# Hooks run in parallel across files by default.
default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false

# IDE settings and build output are not ours to reformat.
exclude: '^(\.idea/|dist/|build/|main\.py$)'

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      # Lint with the full ALL ruleset configured in pyproject.toml.
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: debug-statements
      # Secret hygiene at the commit boundary, before anything leaves the machine.
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Audits our own GitHub Actions workflows for injection, over-broad
  # permissions, unpinned actions and similar supply-chain issues.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
