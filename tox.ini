[tox]
envlist =
    py310-dj32
    py310-dj{40,41}
    py312-dj42
    py{310,313}-dj52
    py{312,313}-dj{60,61}
    py313-djmain
skip_missing_interpreters = true

[testenv]
# The package is pure Python and lives at the repo root, so putting it on
# PYTHONPATH avoids installing it - which keeps the Django pin below the single
# source of truth and works whether or not the venv has pip.
skip_install = true
deps =
    pytest>=8.0
    pytest-xdist>=3.5
    # No single pytest-django spans Django 3.2 -> 6.1, so it is pinned per
    # Django factor: 4.8 covers 3.2-5.0, 4.11 covers 4.2-5.2, 4.14 covers 5.2+.
    dj{32,40,41}: pytest-django>=4.8,<4.9
    dj42: pytest-django>=4.11,<4.12
    dj{52,60,61},djmain: pytest-django>=4.14

    dj32: Django>=3.2,<4.0
    dj40: Django>=4.0,<4.1
    dj41: Django>=4.1,<4.2
    dj42: Django>=4.2,<5.0
    dj52: Django>=5.2,<5.3
    dj60: Django>=6.0,<6.1
    dj61: Django>=6.1,<6.2
    djmain: https://github.com/django/django/archive/main.tar.gz

    postgres: psycopg2-binary
    mysql: pymysql
setenv =
    PYTHONPATH = {toxinidir}
    DB_BACKEND = {env:DB_BACKEND:sqlite}
    # Collection-time guard: tests/models.py imports the package while pytest
    # is collecting, which is before pytest's own filterwarnings apply. The
    # trailing "default:" entry is a TEMPORARY exemption for KNOWN BUG #1 and
    # should be deleted along with providing_args.
    PYTHONWARNINGS = error::DeprecationWarning,error::PendingDeprecationWarning,default:The providing_args argument is deprecated:DeprecationWarning
passenv = PG_*, MY_*
commands =
    pytest {env:PYTEST_ARGS:-n auto} {posargs}

[testenv:py313-djmain]
# Django's unreleased main branch: warns about future breakage without failing
# the build.
ignore_outcome = true
